[project]
name = "other-cluster"
version = "0.1.0"
description = "Audit-friendly clustering for survey Other answers"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openpyxl>=3.1.5",
    "python-dotenv>=1.2.2",
]

[project.scripts]
other-cluster = "other_cluster.cli.main:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
