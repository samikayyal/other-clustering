[project]
name = "other-cluster"
version = "0.1.0"
description = "Audit-friendly clustering for survey Other answers"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "google-genai>=2.14.0",
    "httpx>=0.28.1",
    "numpy>=2.5.1",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.8.0",
]

[project.scripts]
other-cluster = "other_cluster.cli.main:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
other_cluster = ["templates/*.html", "static/*.css", "static/*.js"]

[dependency-groups]
dev = [
    "playwright>=1.62.0",
    "pytest>=9.1.1",
]
